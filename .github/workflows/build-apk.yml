name: Build and Release PASEO SENSI APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Tag Version'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build Debug and Release APK
    runs-on: ubuntu-latest

    env:
      KEYSTORE_PATH: my-upload-key.jks
      STORE_PASSWORD: android
      KEY_PASSWORD: android
      KEY_ALIAS: upload

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Configure Android SDK & Accept Licenses
        run: |
          echo "=== Configuring Android SDK Environment ==="
          # Use pre-installed Android SDK on GitHub Actions runner
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

          # Locate sdkmanager executable
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          elif [ -d "$ANDROID_HOME/cmdline-tools/bin" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
            echo "$ANDROID_HOME/cmdline-tools/bin" >> $GITHUB_PATH
          else
            SDKMANAGER=$(which sdkmanager || find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)
            if [ -n "$SDKMANAGER" ]; then
              echo "$(dirname "$SDKMANAGER")" >> $GITHUB_PATH
            fi
          fi
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

          echo "ANDROID_HOME is: $ANDROID_HOME"
          echo "sdkmanager path: $SDKMANAGER"

          # Pre-seed Android SDK license hashes
          mkdir -p "$ANDROID_HOME/licenses"
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          printf "601085b94cd77f0b54ff86406957099ebe79c4d6\n" > "$ANDROID_HOME/licenses/android-googletv-license"
          printf "33b6a2b64607f11b759f320ef9dff4ae5c47d97a\n" > "$ANDROID_HOME/licenses/google-gdk-license"
          printf "e9acab5b5fbb560a72cfaecce8946896ff6aab9d\n" > "$ANDROID_HOME/licenses/mips-android-sysimage-license"

          # Auto-accept all licenses via sdkmanager
          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses || true
            echo "Installing platforms;android-36 and build-tools;36.0.0..."
            "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          fi

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Prepare Signing Key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD_SECRET: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "=== Configuring Release Signing Credentials ==="
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding custom release keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          elif [ ! -f my-upload-key.jks ]; then
            echo "Creating persistent upload keystore..."
            keytool -genkeypair -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=ZuccheroXann, OU=Development, O=PaseoSensi, L=City, S=State, C=ID"
          else
            echo "Using existing persistent my-upload-key.jks keystore."
          fi

          STORE_PASS="${STORE_PASSWORD_SECRET:-android}"
          KEY_PASS="${KEY_PASSWORD_SECRET:-android}"

          echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV
          echo "STORE_PASSWORD=${STORE_PASS}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${KEY_PASS}" >> $GITHUB_ENV

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug and Release APK
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
          KEY_ALIAS: upload
        run: |
          echo "=== Building Debug APK ==="
          ./gradlew assembleDebug --no-daemon --stacktrace
          echo "=== Building Release APK ==="
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify and Package APKs
        run: |
          mkdir -p output-apks

          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" -type f | head -n 1)
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -n 1)

          if [ -z "$DEBUG_APK" ] || [ ! -f "$DEBUG_APK" ]; then
            echo "Error: Debug APK was not generated!"
            exit 1
          fi

          if [ -z "$RELEASE_APK" ] || [ ! -f "$RELEASE_APK" ]; then
            echo "Error: Release APK was not generated!"
            exit 1
          fi

          echo "Validating archive integrity of APKs..."
          unzip -t "$DEBUG_APK" > /dev/null
          unzip -t "$RELEASE_APK" > /dev/null
          echo "Archive integrity verified: valid Android APK packages."

          DEBUG_SIZE=$(stat -c%s "$DEBUG_APK" 2>/dev/null || stat -f%z "$DEBUG_APK")
          RELEASE_SIZE=$(stat -c%s "$RELEASE_APK" 2>/dev/null || stat -f%z "$RELEASE_APK")

          echo "Debug APK size: $DEBUG_SIZE bytes"
          echo "Release APK size: $RELEASE_SIZE bytes"

          if [ "$RELEASE_SIZE" -lt 5000000 ]; then
            echo "Error: Release APK size ($RELEASE_SIZE bytes) is suspiciously small!"
            exit 1
          fi

          # Output naming: PASEO-SENSI-v1.0.0.apk
          cp "$RELEASE_APK" output-apks/PASEO-SENSI-v1.0.0.apk
          cp "$DEBUG_APK" output-apks/PASEO-SENSI-v1.0.0-debug.apk

          # Package full source code ZIP
          zip -r output-apks/PASEO-SENSI-v1.0.0-source.zip . \
            -x "*.git*" \
            -x "*build*" \
            -x "*.gradle*" \
            -x "*output-apks*" \
            -x "*.idea*"

          echo "=== Verified Output Assets ==="
          ls -lh output-apks/

      - name: Upload APKs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PASEO-SENSI-v1.0.0-assets
          path: output-apks/*
          retention-days: 30

      - name: Publish GitHub Release
        if: (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch') && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: "PASEO SENSI v1.0.0"
          tag_name: ${{ inputs.version_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0') }}
          draft: false
          prerelease: false
          make_latest: true
          overwrite: true
          fail_on_unmatched_files: true
          generate_release_notes: false
          body: |
            ## 🎮 PASEO SENSI — Official Release v1.0.0
            **Created by: ZUCCHERO XANN — DEVELOPER**
            
            ### 📥 Unduhan Langsung APK (Android):
            - 🚀 **[Download PASEO-SENSI-v1.0.0.apk](https://github.com/zuccheroxix-lab/PASEO-TOOLS-/releases/latest/download/PASEO-SENSI-v1.0.0.apk)** (APK Release Siap Pasang)
            - 🛠️ **[Download PASEO-SENSI-v1.0.0-debug.apk](https://github.com/zuccheroxix-lab/PASEO-TOOLS-/releases/latest/download/PASEO-SENSI-v1.0.0-debug.apk)** (APK Debug Pengujian)
            - 📦 **[Download PASEO-SENSI-v1.0.0-source.zip](https://github.com/zuccheroxix-lab/PASEO-TOOLS-/releases/latest/download/PASEO-SENSI-v1.0.0-source.zip)** (Source Code Lengkap)
            
            ---
            
            ### 📱 Panduan Instalasi di HP Android:
            1. Klik tautan **[Download PASEO-SENSI-v1.0.0.apk](https://github.com/zuccheroxix-lab/PASEO-TOOLS-/releases/latest/download/PASEO-SENSI-v1.0.0.apk)** melalui browser HP Anda (Chrome, Samsung Internet, dll.).
            2. Jika muncul peringatan keamanan *"File mungkin berbahaya / File might be harmful"*, pilih **Tetap unduh / Download anyway**.
            3. Setelah selesai, buka berkas dari notifikasi download atau melalui Pengelola File (File Manager) di folder **Download**.
            4. Jika diminta izin instalasi, aktifkan opsi **"Izinkan dari sumber ini / Allow from this source"**.
            5. Tekan **Instal** dan nikmati performa gaming maksimal dengan PASEO SENSI!
            
            ---
            
            ### ✨ Fitur Unggulan:
            - **Shizuku ADB Integration:** Sambungan resmi Wireless Debugging untuk konfigurasi `wm size`, `wm density`, dan `pointer_location`.
            - **Resolution & DPI Manager:** Ubah resolusi render display dan sensitivitas DPI layar dengan konfirmasi dan rollback instan.
            - **ROG Monitoring:** Telemetri nyata RAM (*used/free/total*), suhu baterai (°C), voltase (mV), CPU cores, dan refresh rate layar.
            - **Aim Assistant / Custom Crosshair:** Reticle overlay mengambang yang dapat dikustomisasi (6 bentuk, pilihan warna, ukuran, gap, transparansi, offset X/Y).
            - **Sensi Pack & Aim Trick 15%:** Profil kalibrasi sensitivitas sentuh dan mikro-tuning yang aman dan etis tanpa cheat.
            - **Game Launcher:** Pendeteksi game dan aplikasi terpasang nyata dengan integrasi package manager Android.
          files: |
            output-apks/PASEO-SENSI-v1.0.0.apk
            output-apks/PASEO-SENSI-v1.0.0-debug.apk
            output-apks/PASEO-SENSI-v1.0.0-source.zip
